# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database (PostgreSQL) ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sawai_ghee}?sslmode=${DB_SSL:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:SawaiGheePass2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# FLAG FOR HUMAN DECISION: Changed from 'update' to 'validate' recommended when Flyway is synced.
# Kept as 'update' for now because WholesaleLead entity contains fields (planType, qty200ml, qty500ml,
# qty1L, totalLiters, totalPrice) missing from V1__init_schema.sql. Switch to 'validate' once V2 migration is applied.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:RMqrie7Fu5gk7uuL4XIv39hvtp6xDIspVf5Xah2iJI8=}
app.jwt.expiration=86400000

# ─── Razorpay ────────────────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Su7Do6Ze3c2lJx}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:JsUDxEetOVTvezQtt8NGjStD}
# ─── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://sawaighee.com,https://www.sawaighee.com,https://sawai-ghee.vercel.app,https://sawai-ghee.onrender.com

# ─── Mail (optional – for order confirmation emails) ─────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.sawai=INFO
logging.level.org.springframework.security=WARN

# ─── Flyway Migration ────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ─── File Uploads ────────────────────────────────────────────────────────────
sawai.upload.dir=uploads

# ─── Monitoring (Actuator) ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── Cloudinary ─────────────────────────────────────────────────────────────
cloudinary.url=${CLOUDINARY_URL:}


