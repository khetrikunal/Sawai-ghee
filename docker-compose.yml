version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sawai_postgres
    environment:
      POSTGRES_DB: sawai_ghee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sawai_secure_password_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - sawai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sawai_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sawai_ghee
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: sawai_secure_password_2025
      APP_JWT_SECRET: SawaiGirAmrutGheeSecretKey2025VithobaVenturesLongSecretForJWT
      APP_JWT_EXPIRATION: 86400000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sawai_net
    restart: unless-stopped

  # ─── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sawai_frontend
    environment:
      VITE_API_BASE_URL: http://backend:9090/api
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sawai_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sawai_net:
    driver: bridge
